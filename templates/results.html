<!DOCTYPE html>
<html>
<head>
    <title>Resume Analysis</title>
    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f4f6f9;
            margin:40px;
        }

        .container{
            width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
        }
        h1{text-align:center;
            color:#2c3e50;}
        
            h2{
            color:#34495e;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            padding:8px;
            margin:6px 0;
            background:#ecf0f1;
            border-radius:6px;
        }

        .score{
            text-align:center;
            font-size:28px;
            color:green;
            font-weight:bold;
        }

    </style>
</head>
<body>
    <div class="container">
    <h1>Resume Analyzer</h1>

    <div class="score">Score: {{ score }}/100</div>
    <h2>Detected Skills</h2>

    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>
    <hr>
    <h2>Missing Skills</h2>
    <ul>
        {% for skill in missing_skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>
    </div>
</body>
</html>
