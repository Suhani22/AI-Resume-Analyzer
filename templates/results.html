<!DOCTYPE html>
<html>
<head>
    <title>Resume Analysis</title>
    <link rel="stylesheet" 
    href = "{{url_for('static', filename= 'style.css')}}">

</head>
<body>
    <div class="container">
    <h1>Resume Analyzer</h1>

    <div class="cards">
        <div class="card">
        <h2> Resume score</h2>
        <h1> {{score}}/100</h1>
        <div class="progress">
            <div class="progress-fill" style="width: {{score}}%"></div>
        </div>
        </div>

        <div class = "card">
            <h2>Job Match</h2>
            <h1>{{job_match}}%</h1>

            <div class="progress">
            <div class="progress-fill" style="width: {{job_match}}%"></div>
        </div>
        </div>
    </div>

    <div class = "skills-section">
        <div class="skills-card detected">
            <h2>✅ Detected Skills</h2>

        <ul>
            {% for skill in skills %}
                <li>{{ skill }}</li>
            {% endfor %}
        </ul>

        </div>

        <div class="skills-card missing">
            <h2>❌ Missing Skills</h2>
            <ul>
            {% for skill in missing_skills %}
                <li>{{ skill }}</li>
            {% endfor %}
        </ul>

    </div>
    </div>
    </div>
</body>
</html>
